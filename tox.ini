[tox]
envlist = py3,pep8
minversion = 3.18.0
skipsdist = False
ignore_basepython_conflict = True

[testenv]
basepython = {env:TOX_PYTHON:python3}
usedevelop = True
sitepackages = True
deps =
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/test-requirements.txt
setenv =
    PYTHONPATH = {env:NOVA_SOURCE:{toxinidir}/../nova}{:}{toxinidir}
commands =
    python -m unittest discover tests/unit

[testenv:pep8]
commands =
    python -m compileall rxt_nova_flavor_qos tests

